name: Task06 Selenium

concurrency:
  group: pages-task06-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - Task06
    paths:
      - Task06/**
      - .github/workflows/task06-selenium.yml

jobs:
  selenium-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Docker images
        working-directory: Task06/src
        run: docker compose pull

      - name: Build and start services
        working-directory: Task06/src
        run: docker compose up --build -d

      - name: Run tests and export report
        if: always()
        working-directory: Task06/src
        run: |
          mkdir -p test-results report-site
          
          CID=$(docker compose ps -q test-runner)
          if [ -z "$CID" ]; then
            echo "test-runner container not found"
            echo '<h1>Report not found</h1><p>Test runner container not found.</p>' > report-site/index.html
            echo "1" > test-results/exit-code
            exit 1
          fi

          echo "Waiting for test-runner (CID: $CID)..."
          docker wait "$CID"
          
          EXIT_CODE=$(docker inspect "$CID" --format='{{.State.ExitCode}}' || echo "1")
          echo "Test exit code: $EXIT_CODE"
          echo "$EXIT_CODE" > test-results/exit-code

          # Copy test results immediately
          echo "Copying test results from container..."
          docker cp "$CID":/root/.local/share/dotnet/runfile/. ./test-results/raw 2>/dev/null || true

          # Find HTML report and rename to index.html
          REPORT=$(find ./test-results/raw -type f -iname "*report.html" | head -n1 || true)

          if [ -n "$REPORT" ]; then
            cp "$REPORT" report-site/index.html
            echo "Successfully copied report → index.html"
            echo "Original path: $REPORT"
          else
            echo "HTML report not found"
            echo '<h1>Report not found</h1><p>HTML report file was not found in test results.</p>' > report-site/index.html
          fi

          # Cleanup
          rm -rf ./test-results/raw 2>/dev/null || true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          name: task06-selenium-report
          path: Task06/src/report-site

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
        with:
          artifact_name: task06-selenium-report

      - name: Print test logs
        if: always()
        working-directory: Task06/src
        run: docker compose logs --no-color test-runner || true

      - name: Shutdown services
        if: always()
        working-directory: Task06/src
        run: docker compose down -v

      - name: Fail job if tests failed
        if: always()
        working-directory: Task06/src
        run: |
          if [ -f test-results/exit-code ]; then
            EXIT=$(cat test-results/exit-code)
            echo "Final test exit code: $EXIT"
            if [ "$EXIT" -ne 0 ]; then
              echo "Tests failed"
              exit $EXIT
            else
              echo "All tests passed"
            fi
          fi