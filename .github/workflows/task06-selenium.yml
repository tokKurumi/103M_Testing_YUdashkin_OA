name: Task06 Selenium

concurrency:
  group: pages-task06-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - Task06
    paths:
      - Task06/**
      - .github/workflows/task06-selenium.yml

jobs:
  selenium-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Docker images
        working-directory: Task06/src
        run: docker compose pull

      - name: Build and start services (detached)
        working-directory: Task06/src
        run: docker compose up --build -d

      - name: Wait for test-runner to finish and record exit code
        working-directory: Task06/src
        run: |
          CID=$(docker compose ps -q test-runner)
          if [ -z "$CID" ]; then
            echo "test-runner container not found" >&2
            mkdir -p test-results
            echo "1" > test-results/exit-code || true
            exit 1
          fi

          docker wait "$CID"
          EXIT=$(docker inspect "$CID" --format='{{.State.ExitCode}}' || true)
          mkdir -p test-results
          echo "$EXIT" > test-results/exit-code
          echo "test-runner exit code: $EXIT"

      - name: Export test-runner test results
        if: always()
        working-directory: Task06/src
        run: |
          CID=$(docker compose ps -q test-runner)
          if [ -n "$CID" ]; then
            echo "Found test-runner container: $CID"
            mkdir -p test-results/raw test-results
            # Copy test results
            docker cp "$CID":/root/.local/share/dotnet/runfile/. ./test-results/raw || true

            # Find and rename HTML report to index.html
            REPORT=$(find ./test-results/raw -type f -iname "*report.html" | head -n1 || true)

            if [ -n "$REPORT" ]; then
              cp "$REPORT" ./test-results/index.html
              echo "HTML report found and renamed to index.html"
              echo "Original path: $REPORT"
            else
              echo "No HTML report found"
              echo '<h1>Report not found</h1><p>Check GitHub Actions logs</p>' > ./test-results/index.html
            fi

            rm -rf ./test-results/raw
          else
            echo "test-runner container not found"
            echo '<h1>Report not found</h1><p>Test runner container not found</p>' > ./test-results/index.html
          fi

      - name: Prepare HTML report site for Pages
        if: always()
        working-directory: Task06/src
        run: |
          rm -rf report-site || true
          mkdir -p report-site

          if [ -f test-results/index.html ]; then
            cp test-results/index.html report-site/index.html
            echo "Prepared report-site/index.html"
          else
            echo '<h1>Report not found</h1><p>Check GitHub Actions logs for details</p>' > report-site/index.html
            echo "Created placeholder index.html"
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          name: task06-selenium-report
          path: Task06/src/report-site

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
        with:
          artifact_name: task06-selenium-report

      - name: Print test-runner logs
        if: always()
        working-directory: Task06/src
        run: docker compose logs --no-color test-runner || true

      - name: Shutdown Docker Compose
        if: always()
        working-directory: Task06/src
        run: docker compose down -v

      - name: Fail job if tests failed
        if: always()
        working-directory: Task06/src
        run: |
          if [ -f test-results/exit-code ]; then
            EXIT=$(cat test-results/exit-code)
            echo "Recorded test-runner exit code: $EXIT"
            if [ "$EXIT" -ne 0 ]; then
              echo "Failing job because tests exited with $EXIT"
              exit $EXIT
            else
              echo "All tests passed successfully"
            fi
          fi
