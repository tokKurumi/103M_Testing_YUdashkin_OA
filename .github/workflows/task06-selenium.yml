name: Task06 Selenium

concurrency:
  group: pages-task06-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - Task06
    paths:
      - Task06/**
      - .github/workflows/task06-selenium.yml

jobs:
  selenium-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Docker images
        working-directory: Task06/src
        run: docker compose pull

      - name: Build and start services (detached)
        working-directory: Task06/src
        run: docker compose up --build -d

      - name: Wait for test-runner to finish
        working-directory: Task06/src
        run: |
          CID=$(docker compose ps -q test-runner)
          if [ -z "$CID" ]; then
            echo "test-runner container not found" >&2
            exit 1
          fi
          echo "Waiting for test-runner (CID: $CID)..."
          docker wait "$CID"
          EXIT=$(docker inspect "$CID" --format='{{.State.ExitCode}}' || echo "1")
          echo "test-runner exit code: $EXIT"
          echo "$EXIT" > test-results/exit-code || true

      - name: Export test results and prepare report
        if: always()
        working-directory: Task06/src
        run: |
          mkdir -p test-results report-site
          
          # Try to find the test-runner container (even if stopped)
          CID=$(docker compose ps -q test-runner || echo "")
          
          if [ -n "$CID" ]; then
            echo "Found test-runner container: $CID"
            
            # Copy results from container
            docker cp "$CID":/root/.local/share/dotnet/runfile/. ./test-results/raw 2>/dev/null || true
            
            # Find HTML report and rename it to index.html
            REPORT=$(find ./test-results/raw -type f -iname "*report.html" | head -n1 || true)
            
            if [ -n "$REPORT" ]; then
              cp "$REPORT" report-site/index.html
              echo "Successfully copied and renamed report to index.html"
              echo "Original: $REPORT"
            else
              echo "HTML report not found inside container"
              echo '<h1>Report not found</h1><p>HTML report was not found in test results.</p>' > report-site/index.html
            fi
          else
            echo "test-runner container not found"
            echo '<h1>Report not found</h1><p>Test runner container was not found.</p>' > report-site/index.html
          fi

          # Cleanup raw folder
          rm -rf ./test-results/raw 2>/dev/null || true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          name: task06-selenium-report
          path: Task06/src/report-site

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
        with:
          artifact_name: task06-selenium-report

      - name: Print test-runner logs
        if: always()
        working-directory: Task06/src
        run: docker compose logs --no-color test-runner || true

      - name: Shutdown Docker Compose
        if: always()
        working-directory: Task06/src
        run: docker compose down -v

      - name: Fail job if tests failed
        if: always()
        working-directory: Task06/src
        run: |
          if [ -f test-results/exit-code ]; then
            EXIT=$(cat test-results/exit-code)
            echo "Test exit code: $EXIT"
            if [ "$EXIT" -ne 0 ]; then
              echo "Tests failed with code $EXIT"
              exit $EXIT
            else
              echo "All tests passed"
            fi
          fi
